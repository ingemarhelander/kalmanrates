name: MATLAB Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  portable-tests:
    name: Portable MATLAB tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b

      - name: Run MEX-independent unit and integration tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            setupPaths;
            testFiles = {
              'tests/testDataLimit.m'
              'tests/testLineSearchMain.m'
              'tests/testSelectPolyDegree.m'
              'tests/test_denoise_quadratic_approximation.m'
              'tests/testFindSearchDirection.m'
              'tests/testFindStepLength.m'
            };
            results = runtests(testFiles);
            disp(table(results));
            assertSuccess(results);